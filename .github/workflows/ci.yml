# Phase 15 (docs/phase-15-plan.md). This is a TEST workflow, not a deployment
# pipeline: it proves the code still passes its own suite on a clean, from-scratch
# environment. Every value below is a throwaway dev default (the same ones in
# backend/.env.example) — there are deliberately no GitHub Actions secrets. A real
# deploy job would need real secrets; this one does not (plan §1 Fork E).
#
# `lint`, `test` and `e2e` are required status checks on `develop` — a red run blocks
# the merge (branch protection, issue #6; `frontend` is intentionally not required).
# `develop` also requires a pull request (0 approvals — the solo author self-merges).
# Set via the repo API, not a file here; the exact settings are in docs/phase-16-plan.md §7.
name: CI

on:
  push:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------ lint + typecheck
  # No database. Both steps are blocking. `lint:check` is `eslint` with no --fix — it
  # checks, it does not rewrite (Phase 16, docs/phase-16-plan.md Forks D/E). `nest
  # build` is the typecheck. The tree is clean under both as of Phase 16.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: eslint (check mode, no --fix)
        run: npm run lint:check
        working-directory: backend
      - name: typecheck (nest build)
        run: npm run build
        working-directory: backend

  # ------------------------------------------------------------------ unit + integration
  # `npm test` runs both (jest's testRegex matches *.integration.spec.ts too). The
  # integration specs build their own schema via createTestDataSource()'s
  # synchronize + dropSchema — CI only has to make the database exist.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # The integration specs build their own DataSource against smart_inventory_test
      # (TEST_DB_DATABASE default). DB_DATABASE is set to the same name so any spec that
      # happens to boot the full AppModule connects to a database that exists here,
      # rather than the dev `smart_inventory` this job never creates.
      DB_DATABASE: smart_inventory_test
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create the integration test database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres smart_inventory_test
      - run: npm test
        working-directory: backend

  # ------------------------------------------------------------------ end-to-end
  # smart_inventory_e2e is migration-managed (the app runs synchronize: false; the
  # specs TRUNCATE, they never CREATE). Running the whole migration chain against a
  # freshly created database on every push is the highest-value check here — nothing
  # else exercises the migrations from empty (plan §1 Fork D, §"why now").
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # Each e2e spec also sets this in code before its imports; kept here too so the
      # migration step below targets the same database without a per-step override.
      DB_DATABASE: smart_inventory_e2e
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Create the e2e database
        run: PGPASSWORD=postgres createdb -h localhost -U postgres smart_inventory_e2e
      - name: Run the migration chain from empty
        run: npm run migration:run
        working-directory: backend
        env:
          DB_DATABASE: smart_inventory_e2e
      - run: npm run test:e2e
        working-directory: backend

  # ------------------------------------------------------------------ frontend
  # Enabled in Phase 14 (Fork G — docs/phase-14-plan.md §3): frontend/package.json now
  # exists. No database — `node --test` over the paging logic (pure pagerModel plus one
  # jsdom test). One devDependency (jsdom).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
