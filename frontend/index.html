<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Inventory Manager</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ============================= TOKENS ============================= */
:root{
  --bg:#F5F7F6; --surface:#FFFFFF; --surface-2:#EDF1F0;
  --border:#D8DEDC; --border-strong:#C3CBC8;
  --ink:#14201F; --ink-muted:#55625F; --ink-faint:#8A9794;
  --accent:#146B69; --accent-strong:#0E5250; --accent-soft:#E3EFEE;
  --good:#2E7D46; --good-soft:#E5F3E8;
  --warning:#9C6314; --warning-soft:#FBF0DD;
  --critical:#B23A26; --critical-soft:#FBE7E3;
  --cat-bev:#3E6FB0; --cat-clean:#4C8E8E; --cat-office:#7C55AE; --cat-pack:#5C6B73; --cat-pantry:#A3486E;
  --focus:#146B69;
  --shadow-sm:0 1px 2px rgba(20,32,31,.06), 0 1px 1px rgba(20,32,31,.04);
  --shadow-md:0 4px 12px rgba(20,32,31,.10), 0 2px 4px rgba(20,32,31,.06);
  --font-display:'Big Shoulders', 'Arial Narrow', sans-serif;
  --font-body:'Public Sans', -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'Consolas', monospace;
  --radius:6px; --radius-sm:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1715; --surface:#16211F; --surface-2:#1C2A27;
    --border:#2A3835; --border-strong:#3A4A46;
    --ink:#E8EEEC; --ink-muted:#A9B7B3; --ink-faint:#71827E;
    --accent:#3FBDB6; --accent-strong:#63D1CA; --accent-soft:#16302E;
    --good:#4FAE68; --good-soft:#16301F;
    --warning:#D99A3E; --warning-soft:#332506;
    --critical:#E26850; --critical-soft:#34160F;
    --cat-bev:#6F9CD6; --cat-clean:#7FC4C2; --cat-office:#B08AE0; --cat-pack:#8FA0A6; --cat-pantry:#D687A6;
    --focus:#3FBDB6;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1715; --surface:#16211F; --surface-2:#1C2A27;
  --border:#2A3835; --border-strong:#3A4A46;
  --ink:#E8EEEC; --ink-muted:#A9B7B3; --ink-faint:#71827E;
  --accent:#3FBDB6; --accent-strong:#63D1CA; --accent-soft:#16302E;
  --good:#4FAE68; --good-soft:#16301F;
  --warning:#D99A3E; --warning-soft:#332506;
  --critical:#E26850; --critical-soft:#34160F;
  --cat-bev:#6F9CD6; --cat-clean:#7FC4C2; --cat-office:#B08AE0; --cat-pack:#8FA0A6; --cat-pantry:#D687A6;
  --focus:#3FBDB6;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3); --shadow-md:0 4px 14px rgba(0,0,0,.4);
}

/* ============================= RESET/BASE ============================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:700; margin:0; text-wrap:balance; letter-spacing:.2px;}
p{margin:0;}
a{color:var(--accent); text-decoration:none;}
a:hover{text-decoration:underline;}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit;}
table{border-collapse:collapse; width:100%;}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:3px;}
.tnum{font-variant-numeric:tabular-nums;}
.mono{font-family:var(--font-mono);}
@media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }

/* ============================= APP SHELL ============================= */
#root{min-height:100vh;}
.app-shell{display:flex; min-height:100vh;}
.sidebar{
  width:224px; flex:none; background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.sidebar-brand{
  padding:20px 18px 16px; border-bottom:1px solid var(--border);
}
.sidebar-brand .wordmark{
  font-family:var(--font-display); font-weight:800; font-size:1.35rem; letter-spacing:.3px;
  color:var(--ink); line-height:1.05; text-transform:uppercase;
}
.sidebar-brand .wordmark span{color:var(--accent);}
.sidebar-brand .tagline{font-size:.7rem; color:var(--ink-faint); margin-top:3px; letter-spacing:.4px; text-transform:uppercase;}
.sidebar-nav{padding:14px 10px; display:flex; flex-direction:column; gap:2px; flex:1;}
.nav-item{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--radius);
  color:var(--ink-muted); font-weight:600; font-size:.875rem; cursor:pointer; border:1px solid transparent;
}
.nav-item:hover{background:var(--surface-2); color:var(--ink); text-decoration:none;}
.nav-item.active{background:var(--accent-soft); color:var(--accent-strong); border-color:transparent;}
.nav-item svg{flex:none; width:17px; height:17px; opacity:.85;}
.nav-item .count{margin-left:auto; font-size:.7rem; font-family:var(--font-mono); background:var(--surface-2); padding:1px 6px; border-radius:8px; color:var(--ink-muted);}
.nav-item.active .count{background:var(--accent); color:#fff;}
.sidebar-foot{padding:14px 18px; border-top:1px solid var(--border); font-size:.75rem; color:var(--ink-faint);}

.topbar{
  height:58px; flex:none; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 24px; position:sticky; top:0; z-index:5;
}
.topbar-title{font-size:1rem; font-weight:700; color:var(--ink);}
.topbar-crumbs{font-size:.8rem; color:var(--ink-faint);}
.topbar-crumbs a{color:var(--ink-faint);}
.topbar-crumbs a:hover{color:var(--accent);}
.user-chip{display:flex; align-items:center; gap:8px; font-size:.82rem;}
.user-avatar{
  width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent-strong);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.72rem; font-family:var(--font-display);
}
.user-meta .name{font-weight:600; color:var(--ink);}
.user-meta .role{color:var(--ink-faint); font-size:.72rem;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.content{padding:28px 32px 60px; max-width:1180px; width:100%; margin:0 auto;}
.content-header{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.content-header h1{font-size:1.7rem;}
.content-header .sub{color:var(--ink-muted); font-size:.88rem; margin-top:4px;}
.header-actions{display:flex; gap:8px; flex:none;}

@media (max-width: 880px){
  .sidebar{width:64px;}
  .sidebar-brand .tagline, .sidebar-brand .wordmark, .nav-item span.label, .sidebar-foot{display:none;}
  .nav-item{justify-content:center;}
  .content{padding:20px 16px 48px;}
}

/* ============================= LOGIN ============================= */
.login-page{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--bg);}
.login-card{width:100%; max-width:380px;}
.login-brand{margin-bottom:22px;}
.login-brand .wordmark{font-family:var(--font-display); font-weight:800; font-size:1.35rem; letter-spacing:.3px; color:var(--ink); text-transform:uppercase;}
.login-brand .wordmark span{color:var(--accent);}
.login-brand .tagline{font-size:.7rem; color:var(--ink-faint); margin-top:2px; letter-spacing:.4px; text-transform:uppercase;}
.login-card h1{font-size:1.3rem;}

/* ============================= BUTTONS ============================= */
.btn{
  display:inline-flex; align-items:center; gap:6px; justify-content:center; white-space:nowrap;
  padding:8px 14px; border-radius:var(--radius); font-weight:600; font-size:.85rem; cursor:pointer;
  border:1px solid transparent; transition:background .12s ease, border-color .12s ease;
}
.btn svg{width:14px; height:14px;}
.btn-primary{background:var(--accent); color:#fff;}
.btn-primary:hover{background:var(--accent-strong); text-decoration:none;}
.btn-primary:disabled{background:var(--border-strong); cursor:not-allowed;}
.btn-secondary{background:var(--surface); color:var(--ink); border-color:var(--border-strong);}
.btn-secondary:hover{background:var(--surface-2); text-decoration:none;}
.btn-danger{background:var(--surface); color:var(--critical); border-color:var(--critical);}
.btn-danger:hover{background:var(--critical-soft); text-decoration:none;}
.btn-ghost{background:transparent; color:var(--ink-muted); border-color:transparent; padding:6px 10px;}
.btn-ghost:hover{background:var(--surface-2); color:var(--ink); text-decoration:none;}
.btn-sm{padding:5px 10px; font-size:.78rem;}
.btn[disabled]{opacity:.55; cursor:not-allowed;}
.btn-block{width:100%;}

/* ============================= CARDS / STAT TILES ============================= */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow-sm);}
.card-pad{padding:20px 22px;}
.card-header{display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--border);}
.card-header h2{font-size:1.05rem;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
@media (max-width:900px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-tile{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow-sm); cursor:pointer; display:block;}
.stat-tile:hover{border-color:var(--border-strong); text-decoration:none;}
.stat-tile .label{font-size:.72rem; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint); font-weight:600;}
.stat-tile .value{font-family:var(--font-display); font-weight:800; font-size:2.1rem; line-height:1.1; margin-top:4px; color:var(--ink);}
.stat-tile .value.warning{color:var(--warning);}
.stat-tile .value.critical{color:var(--critical);}
.stat-tile .foot{font-size:.75rem; color:var(--ink-faint); margin-top:4px;}

/* ============================= TABLE ============================= */
.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface);}
table.data-table{min-width:640px;}
table.data-table th{
  text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-faint);
  font-weight:700; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--border); white-space:nowrap;
}
table.data-table td{padding:11px 14px; border-bottom:1px solid var(--border); font-size:.86rem; vertical-align:middle;}
table.data-table tbody tr:last-child td{border-bottom:none;}
table.data-table tbody tr.clickable{cursor:pointer;}
table.data-table tbody tr.clickable:hover{background:var(--surface-2);}
.cell-name{font-weight:600; color:var(--ink);}
.cell-sub{color:var(--ink-faint); font-size:.78rem;}

/* ============================= BADGES / CHIPS ============================= */
.badge{display:inline-flex; align-items:center; gap:4px; font-size:.72rem; font-weight:700; padding:3px 8px; border-radius:var(--radius-sm); white-space:nowrap;}
.badge-active{background:var(--good-soft); color:var(--good);}
.badge-inactive{background:var(--surface-2); color:var(--ink-faint);}
.badge-low{background:var(--warning-soft); color:var(--warning);}
.badge-out{background:var(--critical-soft); color:var(--critical);}
.badge-type-in{background:var(--good-soft); color:var(--good);}
.badge-type-out{background:var(--surface-2); color:var(--ink-muted);}
.badge-type-adj{background:var(--warning-soft); color:var(--warning);}
.cat-chip{display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; color:var(--ink-muted);}
.cat-chip::before{content:''; width:7px; height:7px; border-radius:2px; background:var(--dot,var(--ink-faint));}
.qty-pos{color:var(--good);}
.qty-neg{color:var(--ink);}

/* ============================= FORMS ============================= */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.form-grid.single{grid-template-columns:1fr;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:16px;}
.field label{font-size:.78rem; font-weight:600; color:var(--ink-muted);}
.field .req{color:var(--critical);}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=email],.field select,.field textarea{
  padding:9px 11px; border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--ink); width:100%;
}
.field textarea{resize:vertical; min-height:70px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field.has-error input,.field.has-error select,.field.has-error textarea{border-color:var(--critical);}
.field .hint{font-size:.74rem; color:var(--ink-faint);}
.field .error{font-size:.76rem; color:var(--critical); font-weight:600;}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:.85rem;}
.form-actions{display:flex; gap:10px; margin-top:6px;}

/* ============================= TOOLBAR / SEARCH / SEGMENTED ============================= */
.toolbar{display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.search-input{position:relative; flex:1; min-width:200px; max-width:320px;}
.search-input input{width:100%; padding:8px 12px 8px 32px; border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--ink);}
.search-input svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--ink-faint);}
.select-filter{padding:8px 10px; border:1px solid var(--border-strong); border-radius:var(--radius); background:var(--surface); color:var(--ink); font-size:.83rem;}
.segmented{display:inline-flex; border:1px solid var(--border-strong); border-radius:var(--radius); overflow:hidden;}
.segmented button{background:var(--surface); border:none; padding:7px 13px; font-size:.8rem; font-weight:600; color:var(--ink-muted); cursor:pointer; border-right:1px solid var(--border-strong);}
.segmented button:last-child{border-right:none;}
.segmented button.active{background:var(--accent-soft); color:var(--accent-strong);}
.preview-state{margin-left:auto; display:flex; align-items:center; gap:6px; border:1px dashed var(--border-strong); border-radius:var(--radius); padding:4px 8px; font-size:.72rem; color:var(--ink-faint);}
.preview-state select{border:none; background:transparent; color:var(--ink-muted); font-size:.72rem; font-weight:600;}

/* ============================= EMPTY / ERROR / SKELETON ============================= */
.empty-state,.error-state{display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:52px 24px; color:var(--ink-muted);}
.empty-state svg,.error-state svg{width:34px; height:34px; color:var(--ink-faint); margin-bottom:4px;}
.error-state svg{color:var(--critical);}
.empty-state h3,.error-state h3{font-size:1rem; font-family:var(--font-body); font-weight:700; color:var(--ink);}
.empty-state p,.error-state p{font-size:.85rem; max-width:360px;}

.skeleton{background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:4px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:0 0;}}
.skeleton-line{height:12px; margin:6px 0;}
.skeleton-row td{padding:14px;}

/* ============================= WIZARD / REVIEW ============================= */
.wizard-wrap{max-width:560px;}
.wizard-steps{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
.wizard-steps .step{display:flex; align-items:center; gap:6px; font-size:.76rem; font-weight:700; color:var(--ink-faint);}
.wizard-steps .step.active{color:var(--accent-strong);}
.wizard-steps .step.done{color:var(--good);}
.wizard-steps .dot{width:20px; height:20px; border-radius:50%; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:.7rem; border:1px solid var(--border-strong);}
.wizard-steps .step.active .dot{background:var(--accent); color:#fff; border-color:var(--accent);}
.wizard-steps .step.done .dot{background:var(--good); color:#fff; border-color:var(--good);}
.wizard-steps .sep{flex:1; height:1px; background:var(--border-strong); max-width:36px;}
.review-card{border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
.review-row{display:flex; justify-content:space-between; padding:11px 16px; border-bottom:1px solid var(--border); font-size:.86rem;}
.review-row:last-child{border-bottom:none;}
.review-row .k{color:var(--ink-muted);}
.review-row .v{font-weight:600; text-align:right;}
.review-highlight{background:var(--accent-soft); padding:14px 16px; display:flex; justify-content:space-between; align-items:center; border-radius:var(--radius); margin:14px 0;}
.review-highlight .arrow{color:var(--ink-faint); margin:0 8px;}
.success-panel{display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding:22px; background:var(--good-soft); border:1px solid var(--good); border-radius:var(--radius);}
.success-panel .icon-circle{width:36px; height:36px; border-radius:50%; background:var(--good); color:#fff; display:flex; align-items:center; justify-content:center;}
.success-panel h3{font-family:var(--font-body); font-size:1.05rem;}
.inline-notice{display:flex; gap:10px; padding:14px 16px; border-radius:var(--radius); font-size:.85rem; align-items:flex-start;}
.inline-notice.warn{background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning);}
.inline-notice.info{background:var(--surface-2); color:var(--ink-muted); border:1px solid var(--border);}
.confirm-inline{display:flex; align-items:center; gap:8px; background:var(--critical-soft); border:1px solid var(--critical); padding:10px 12px; border-radius:var(--radius); font-size:.82rem;}

/* ============================= TOAST ============================= */
.toast-container{position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:100;}
.toast{background:var(--ink); color:var(--bg); padding:11px 16px; border-radius:var(--radius); box-shadow:var(--shadow-md); font-size:.84rem; display:flex; align-items:center; gap:8px; min-width:220px; animation:toast-in .18s ease;}
.toast.success{background:var(--good);}
.toast.error{background:var(--critical);}
@keyframes toast-in{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:translateY(0);}}

/* ============================= DETAIL PAGE ============================= */
.detail-hero{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:22px;}
.detail-id{color:var(--ink-faint); font-size:.8rem; margin-top:2px;}
.detail-stock{display:flex; align-items:baseline; gap:8px; margin-top:10px;}
.detail-stock .num{font-family:var(--font-display); font-weight:800; font-size:2.6rem; line-height:1;}
.detail-stock .unit{color:var(--ink-muted); font-size:.9rem;}
.detail-meta{display:flex; gap:22px; flex-wrap:wrap; margin-top:14px; font-size:.82rem; color:var(--ink-muted);}
.detail-meta .k{display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-faint); margin-bottom:2px;}
.section-title{font-size:1rem; margin:30px 0 12px;}
.action-row{display:flex; gap:8px; flex-wrap:wrap;}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast-container" id="toast-container"></div>
<script>
'use strict';
/* SECTION:DATA */
// Phase 2: this used to hold the mockup's hand-authored mock arrays (products,
// suppliers, transactions...). All of that now lives in PostgreSQL, behind the
// NestJS API — see Store, below, which replaces every one of those arrays with a
// fetch() call. Only two small pieces of client-side state remain: the date-default
// helpers (still needed for form fields) and a couple of reference-data caches
// (categories/current user) that are cheap to fetch once and reuse.
const API_BASE = window.API_BASE || 'http://localhost:3000';

function todayInputValue(){
  const d = new Date();
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Populated once right after login (see Store.loadReferenceData) — categories rarely
// change and every screen that needs them (product list/detail/form) can just read
// this array synchronously instead of re-fetching on every render.
let CATEGORIES = [];
let CURRENT_USER = null; // { id, name, role } — set by Store.login(), cleared by Store.logout()

// Phase 3 (docs/phase-3-plan.md "Token transport"): held in a plain JS variable, not
// localStorage — matching how the rest of Store already avoids persisting anything
// client-side. The one consequence worth stating plainly: a page refresh loses this
// and logs the user out. That's an accepted MVP tradeoff for a single-page tool with
// no build step, not a bug.
let ACCESS_TOKEN = null;

/* SECTION:STORE */
// Phase 1's Store computed everything from local arrays. Phase 2's Store is a thin
// wrapper around fetch() calls to the NestJS API — every method below now returns a
// Promise, and the business rules it used to enforce client-side (BR-020/021,
// BR-031/033, BR-060/061, BR-001...) now live exactly once, server-side, in
// InventoryService/ProductsService (see backend/src). This file trusts the API's
// responses instead of re-deriving them, the same way any real frontend would.
//
// The backend's transaction `type` values are 'stock_in'/'stock_out'/'adjustment'
// (see common/enums/transaction-type.enum.ts); the UI's routes and internal code use
// the hyphenated 'stock-in'/'stock-out'/'adjustment' instead (see the router, below).
// normalizeTx() is the one place that translation happens, so the rest of the view
// code never has to think about it.
function normalizeTx(t){
  return {
    id: t.id,
    productId: t.productId,
    type: t.type === 'stock_in' ? 'stock-in' : t.type === 'stock_out' ? 'stock-out' : 'adjustment',
    delta: t.quantityDelta,
    date: new Date(t.occurredAt),
    reason: t.reason || '',
    supplier: t.supplier || null,
    recordedBy: t.recordedBy || null,
    product: t.product || null,
  };
}

const Store = {
  // Every request goes through here: it attaches the bearer token (see
  // docs/phase-3-plan.md "Token transport" — this replaces Phase 2's client-supplied
  // `x-user-id` header with a server-verified token), and turns a non-2xx response
  // into a thrown Error whose message is exactly what the API's
  // ValidationPipe/exception filter sent back — the same message a
  // `try { await Store.x() } catch (err) { err.message }` pattern in the wizards
  // already expected from Phase 1's synchronous version.
  async _request(method, path, body){
    const options = { method, headers: {} };
    if (body !== undefined){
      options.headers['Content-Type'] = 'application/json';
      options.body = JSON.stringify(body);
    }
    if (ACCESS_TOKEN) options.headers['Authorization'] = `Bearer ${ACCESS_TOKEN}`;
    const res = await fetch(API_BASE + path, options);
    if (res.status === 204) return null;
    let data = null;
    try { data = await res.json(); } catch (e) { /* empty body */ }
    // A 401 here means the token we were holding (if any) is no longer good enough —
    // missing, expired, or malformed. Discard it and bounce back to the login screen.
    // Excluded for /auth/login itself: a *wrong password* also comes back as 401, and
    // that's a form validation error the login screen should display inline, not a
    // "your session expired" redirect (see Views.login).
    if (res.status === 401 && path !== '/auth/login'){
      ACCESS_TOKEN = null;
      CURRENT_USER = null;
      if (location.hash !== '#/login') UI.navigate('#/login'); else renderApp();
    }
    if (!res.ok){
      const message = data && (Array.isArray(data.message) ? data.message.join(' ') : data.message);
      throw new Error(message || `Request failed (${res.status}).`);
    }
    return data;
  },

  // FR-060. Every write endpoint requires a token now (JwtAuthGuard, registered
  // globally — see docs/phase-3-plan.md "Guard rollout"), so nothing else in Store
  // can succeed until this has run. Loads reference data (categories) as part of
  // login rather than leaving the caller to remember a second step — every view that
  // reads CATEGORIES synchronously needs it populated by the time the post-login
  // route first renders.
  async login(email, password){
    const result = await this._request('POST', '/auth/login', { email, password });
    ACCESS_TOKEN = result.accessToken;
    CURRENT_USER = result.user;
    await this.loadReferenceData();
    return result.user;
  },

  // Client-side only, no server call — a stateless JWT can't be revoked without
  // adding the exact kind of server-side state a JWT is meant to avoid (see
  // docs/phase-3-plan.md "Logout: client-side only, no revocation list"). Signing
  // out just means the frontend forgets the token.
  logout(){
    ACCESS_TOKEN = null;
    CURRENT_USER = null;
    if (location.hash === '#/login') renderApp(); else UI.navigate('#/login');
  },

  async loadReferenceData(){
    CATEGORIES = await this._request('GET', '/categories');
  },

  getCategory(id){ return CATEGORIES.find(c => c.id === id) || null; },

  listProducts({ search, status, category } = {}){
    const q = new URLSearchParams();
    if (search) q.set('search', search);
    if (status) q.set('status', status);
    if (category) q.set('categoryId', category);
    const qs = q.toString();
    return this._request('GET', '/products' + (qs ? '?' + qs : ''));
  },
  getProduct(id){ return this._request('GET', `/products/${id}`); },
  createProduct(data){
    return this._request('POST', '/products', {
      name: data.name.trim(),
      sku: data.sku.trim(),
      unit: data.unit.trim(),
      categoryId: data.categoryId ? Number(data.categoryId) : undefined,
      lowStockThreshold: data.threshold === '' ? undefined : Number(data.threshold),
    });
  },
  updateProduct(id, data){
    const body = {
      name: data.name.trim(),
      unit: data.unit.trim(),
      categoryId: data.categoryId ? Number(data.categoryId) : null,
      lowStockThreshold: data.threshold === '' ? null : Number(data.threshold),
    };
    // Omitted entirely when locked, rather than sent unchanged — matches the Product
    // Form disabling the field outright when the product has history (BR-001).
    if (data.sku !== undefined) body.sku = data.sku.trim();
    return this._request('PATCH', `/products/${id}`, body);
  },
  setProductStatus(id, status){ return this._request('PATCH', `/products/${id}/status`, { status }); },
  deleteProduct(id){ return this._request('DELETE', `/products/${id}`); },

  listSuppliers({ status, search } = {}){
    const q = new URLSearchParams();
    if (status) q.set('status', status);
    if (search) q.set('search', search);
    const qs = q.toString();
    return this._request('GET', '/suppliers' + (qs ? '?' + qs : ''));
  },
  getSupplierById(id){ return this._request('GET', `/suppliers/${id}`); },
  createSupplier(data){
    return this._request('POST', '/suppliers', {
      name: data.name.trim(),
      contactName: (data.contact || '').trim() || undefined,
      email: (data.email || '').trim() || undefined,
      phone: (data.phone || '').trim() || undefined,
    });
  },
  updateSupplier(id, data){
    return this._request('PATCH', `/suppliers/${id}`, {
      name: data.name.trim(),
      contactName: (data.contact || '').trim(),
      email: (data.email || '').trim(),
      phone: (data.phone || '').trim(),
    });
  },
  setSupplierStatus(id, status){ return this._request('PATCH', `/suppliers/${id}/status`, { status }); },

  async listTransactionsForProduct(id){
    const rows = await this._request('GET', `/products/${id}/transactions`);
    return rows.map(normalizeTx);
  },
  async listTransactionsForSupplier(id){
    const rows = await this._request('GET', `/inventory-transactions?supplierId=${id}`);
    return rows.map(normalizeTx);
  },
  async listAllTransactions({ type, productId, days } = {}){
    const q = new URLSearchParams();
    if (type) q.set('type', type === 'stock-in' ? 'stock_in' : type === 'stock-out' ? 'stock_out' : type);
    if (productId) q.set('productId', productId);
    if (days) q.set('days', days);
    const qs = q.toString();
    const rows = await this._request('GET', '/inventory-transactions' + (qs ? '?' + qs : ''));
    return rows.map(normalizeTx);
  },
  async recentActivity(limit){
    const rows = await this._request('GET', '/inventory-transactions');
    return rows.slice(0, limit).map(normalizeTx);
  },

  getDashboardSummary(){ return this._request('GET', '/dashboard/summary'); },

  // Three thin methods instead of Phase 1's single createTransaction({ type, ... })
  // dispatcher — each now maps to its own REST action (POST /products/:id/stock-in
  // etc.), so there's no client-side type-switch left to keep in sync with the API.
  async recordStockIn(productId, { quantity, date, supplierId }){
    const tx = await this._request('POST', `/products/${productId}/stock-in`, {
      quantity: Number(quantity), occurredAt: date, supplierId: supplierId ? Number(supplierId) : undefined,
    });
    return normalizeTx(tx);
  },
  async recordStockOut(productId, { quantity, date, reason }){
    const tx = await this._request('POST', `/products/${productId}/stock-out`, {
      quantity: Number(quantity), occurredAt: date, reason: reason || undefined,
    });
    return normalizeTx(tx);
  },
  async recordAdjustment(productId, { newQty, date, reason }){
    const tx = await this._request('POST', `/products/${productId}/adjustments`, {
      newQuantity: Number(newQty), occurredAt: date, reason,
    });
    return normalizeTx(tx);
  },
};

/* SECTION:UI */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const UI = {
  esc(str){
    return String(str ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  },
  fmtDate(d){
    return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  },
  fmtDateTime(d){
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return `${this.fmtDate(d)} · ${h}:${m} ${ampm}`;
  },
  fmtQty(n, unit){
    const sign = n > 0 ? '+' : (n < 0 ? '−' : '');
    return `${sign}${Math.abs(n)} ${unit}`;
  },
  navigate(hash){ location.hash = hash; },

  icon(name){
    const icons = {
      dashboard:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="6.5" height="6.5" rx="1"/><rect x="11" y="2.5" width="6.5" height="6.5" rx="1"/><rect x="2.5" y="11" width="6.5" height="6.5" rx="1"/><rect x="11" y="11" width="6.5" height="6.5" rx="1"/></svg>',
      products:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="6" width="15" height="11.5" rx="1"/><path d="M2.5 6 10 2.5 17.5 6"/><path d="M10 6v11.5"/></svg>',
      suppliers:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="8" width="10" height="8" rx="1"/><path d="M12 11h3.5l2.5 2.5V16h-6"/><circle cx="5.5" cy="16.5" r="1.4"/><circle cx="14.5" cy="16.5" r="1.4"/></svg>',
      history:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="3" cy="5" r="1"/><path d="M6 5h11.5"/><circle cx="3" cy="10" r="1"/><path d="M6 10h11.5"/><circle cx="3" cy="15" r="1"/><path d="M6 15h8"/></svg>',
      search:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M17 17l-4-4"/></svg>',
      plus:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 3.5v13M3.5 10h13"/></svg>',
      check:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 10.5l4 4 8-9"/></svg>',
      warning:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10 2.5 18 17H2z" stroke-linejoin="round"/><path d="M10 8v4"/><circle cx="10" cy="14.3" r=".2" stroke-width="2.4"/></svg>',
      error:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7.5"/><path d="M7.5 7.5l5 5M12.5 7.5l-5 5"/></svg>',
      empty:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="14" height="9" rx="1"/><path d="M3 7l2.5-4h9L17 7"/><path d="M8 11h4"/></svg>',
      arrowLeft:'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12.5 4.5 6 10l6.5 5.5"/></svg>',
    };
    return icons[name] || '';
  },

  badgeStatus(status){
    return status === 'active'
      ? '<span class="badge badge-active">Active</span>'
      : '<span class="badge badge-inactive">Inactive</span>';
  },
  // Out-of-stock is the more severe subset of low-stock — showing only one badge keeps
  // the signal legible instead of stacking two chips that mean almost the same thing.
  // Phase 2: reads the fields ProductsService already computed server-side
  // (currentStock/lowStock/outOfStock) instead of recomputing them here.
  badgeStockLevel(product){
    if (product.outOfStock) return '<span class="badge badge-out">Out of stock</span>';
    if (product.lowStock) return '<span class="badge badge-low">Low stock</span>';
    return '';
  },
  typeBadge(type){
    if (type === 'stock-in') return '<span class="badge badge-type-in">Stock In</span>';
    if (type === 'stock-out') return '<span class="badge badge-type-out">Stock Out</span>';
    return '<span class="badge badge-type-adj">Adjustment</span>';
  },
  // Keyed by category NAME rather than a fixed id — Phase 1 used hand-picked ids
  // like 'cat-bev'; the database assigns its own numeric ids on seed, so the name is
  // the only stable thing left to color by.
  catChip(categoryId){
    const cat = Store.getCategory(categoryId);
    if (!cat) return '<span class="cell-sub">—</span>';
    const dotByName = {
      'Beverages & Café Supplies': 'var(--cat-bev)',
      'Cleaning & Janitorial': 'var(--cat-clean)',
      'Office & Stationery': 'var(--cat-office)',
      'Packaging & Shipping': 'var(--cat-pack)',
      'Break Room & Pantry': 'var(--cat-pantry)',
    };
    const dot = dotByName[cat.name] || 'var(--ink-faint)';
    return `<span class="cat-chip" style="--dot:${dot}">${UI.esc(cat.name)}</span>`;
  },

  toast(message, type){
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast' + (type ? ' ' + type : '');
    el.innerHTML = (type === 'success' ? UI.icon('check') : type === 'error' ? UI.icon('error') : '') + `<span>${UI.esc(message)}</span>`;
    container.appendChild(el);
    setTimeout(() => { el.style.transition = 'opacity .25s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 260); }, 3400);
  },

  // Phase 1 wrapped a synchronous mock-data read in an artificial delay to fake
  // network latency. Phase 2's `factory` already talks to a real API over real
  // network, so the delay is gone — but the "Preview state" control (below) still
  // needs a way to force an error without actually calling the API, which is what
  // forceState:'error' does. Promise.resolve().then(factory) (rather than just
  // `return factory()`) guarantees this always returns a genuine Promise even if a
  // view's factory synchronously returns a plain value for its own 'empty' case.
  mockFetch(factory, { forceState = null } = {}){
    if (forceState === 'error'){
      return Promise.reject(new Error('Could not reach the server. Check your connection and try again.'));
    }
    return Promise.resolve().then(factory);
  },

  // A dev-only affordance (not part of the real product) so a reviewer can preview
  // Loading / Empty / Error states without needing a real backend to misbehave.
  previewControl(current){
    const opts = [['normal','Normal'],['loading','Loading'],['empty','Empty (no data)'],['error','Error']];
    return `<div class="preview-state" title="Review-only control to preview UI states">
      <label for="preview-select">Preview state</label>
      <select id="preview-select">${opts.map(([v,l]) => `<option value="${v}" ${v===current?'selected':''}>${l}</option>`).join('')}</select>
    </div>`;
  },

  skeletonRows(cols, rows){
    let out = '';
    for (let r = 0; r < rows; r++){
      out += '<tr class="skeleton-row">' + Array.from({length: cols}).map(() => `<td><div class="skeleton skeleton-line" style="width:${60 + Math.round(Math.random()*30)}%"></div></td>`).join('') + '</tr>';
    }
    return out;
  },
  emptyState(title, body){
    return `<div class="empty-state">${UI.icon('empty')}<h3>${UI.esc(title)}</h3><p>${UI.esc(body)}</p></div>`;
  },
  errorState(message, retryId){
    return `<div class="error-state">${UI.icon('error')}<h3>Something went wrong</h3><p>${UI.esc(message)}</p><button class="btn btn-secondary btn-sm" id="${retryId}">Retry</button></div>`;
  },
};

// Phase 1's shell showed live counts (total products, suppliers, low-stock) directly
// in the sidebar, for free, because everything sat in local arrays already in memory.
// Phase 2 could still do that, but only by firing extra fetches purely to populate a
// sidebar badge on every single navigation — not worth it for what those counts add;
// the Dashboard's stat tiles already own that job properly (one real fetch, on the
// one screen where "totals" is the point). So the shell drops them here.
function shellTemplate(section){
  const navItem = (key, hash, label, icon) => `
    <a class="nav-item${section===key?' active':''}" href="${hash}">
      ${UI.icon(icon)}<span class="label">${label}</span>
    </a>`;
  // CURRENT_USER is set by Store.login() — renderApp() (see SECTION:ROUTER) never
  // calls into shellTemplate at all until a login has actually succeeded, so it's
  // always set by the time any view renders.
  const user = CURRENT_USER || { initials: '?', name: 'Unknown', role: '' };
  return `
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="wordmark">Smart<span>Inventory</span></div>
        <div class="tagline">Manager</div>
      </div>
      <nav class="sidebar-nav">
        ${navItem('dashboard', '#/dashboard', 'Dashboard', 'dashboard')}
        ${navItem('products', '#/products', 'Products', 'products')}
        ${navItem('suppliers', '#/suppliers', 'Suppliers', 'suppliers')}
        ${navItem('history', '#/history', 'Inventory History', 'history')}
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-title" id="topbar-title">Smart Inventory Manager</div>
        <div class="user-chip">
          <div class="user-avatar">${UI.esc(user.initials || user.name.slice(0,2).toUpperCase())}</div>
          <div class="user-meta"><div class="name">${UI.esc(user.name)}</div><div class="role">${UI.esc(user.role)}</div></div>
          <button class="btn btn-ghost btn-sm" id="logout-btn" type="button">Sign out</button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>`;
}

function parseHash(){
  let hash = location.hash.slice(1) || '/dashboard';
  const [path, queryStr] = hash.split('?');
  const parts = path.split('/').filter(Boolean);
  return { parts, query: new URLSearchParams(queryStr || '') };
}

function renderApp(){
  const root = document.getElementById('root');

  // Gate the whole app shell on having a token, rather than a route guard on each
  // individual view — one check instead of one per screen, and it can't be
  // forgotten on a route added later (same "register the cross-cutting thing once"
  // reasoning the backend's global JwtAuthGuard follows — see
  // docs/phase-3-plan.md "Guard rollout"). Whatever hash the user landed on is
  // simply ignored until they've signed in.
  if (!ACCESS_TOKEN){
    root.innerHTML = '';
    Views.login(root);
    return;
  }
  if (!location.hash || location.hash === '#' || location.hash === '#/login'){
    location.hash = '#/dashboard';
    return;
  }
  const { parts, query } = parseHash();
  const section = parts[0] || 'dashboard';
  root.innerHTML = shellTemplate(section);
  document.getElementById('logout-btn').addEventListener('click', () => Store.logout());
  const view = document.getElementById('view');
  const crumb = document.getElementById('topbar-title');

  try {
    if (parts[0] === 'dashboard' || parts.length === 0){
      crumb.textContent = 'Dashboard';
      Views.dashboard(view, query);
    } else if (parts[0] === 'products' && parts.length === 1){
      crumb.textContent = 'Products';
      Views.productList(view, query);
    } else if (parts[0] === 'products' && parts[1] === 'new'){
      crumb.textContent = 'New Product';
      Views.productForm(view, null);
    } else if (parts[0] === 'products' && parts.length === 2){
      crumb.textContent = 'Product Detail';
      Views.productDetail(view, parts[1]);
    } else if (parts[0] === 'products' && parts[2] === 'edit'){
      crumb.textContent = 'Edit Product';
      Views.productForm(view, parts[1]);
    } else if (parts[0] === 'products' && parts[2] === 'stock-in'){
      crumb.textContent = 'Stock In';
      Views.transactionWizard(view, parts[1], 'stock-in');
    } else if (parts[0] === 'products' && parts[2] === 'stock-out'){
      crumb.textContent = 'Stock Out';
      Views.transactionWizard(view, parts[1], 'stock-out');
    } else if (parts[0] === 'products' && parts[2] === 'adjust'){
      crumb.textContent = 'Adjust Stock';
      Views.transactionWizard(view, parts[1], 'adjustment');
    } else if (parts[0] === 'history'){
      crumb.textContent = 'Inventory History';
      Views.historyView(view, query);
    } else if (parts[0] === 'suppliers' && parts.length === 1){
      crumb.textContent = 'Suppliers';
      Views.supplierList(view, query);
    } else if (parts[0] === 'suppliers' && parts[1] === 'new'){
      crumb.textContent = 'New Supplier';
      Views.supplierForm(view, null);
    } else if (parts[0] === 'suppliers' && parts.length === 2){
      crumb.textContent = 'Supplier Detail';
      Views.supplierDetail(view, parts[1]);
    } else if (parts[0] === 'suppliers' && parts[2] === 'edit'){
      crumb.textContent = 'Edit Supplier';
      Views.supplierForm(view, parts[1]);
    } else {
      view.innerHTML = UI.emptyState('Page not found', 'That screen does not exist in this mockup.');
    }
  } catch (err) {
    view.innerHTML = UI.errorState(err.message || 'Unexpected error rendering this screen.', 'retry-render');
  }
  window.scrollTo(0, 0);
}

const Views = {};
// -------------------------------------------------------------- Login --
// FR-060. Replaces Phase 1's static "Signed in as Jordan Lee · Staff" chip
// (ui-open-questions.md Q-UI-4) with a real credential form — see
// docs/phase-3-plan.md §3 "Frontend changes". Rendered outside the app shell
// entirely (no sidebar/topbar — there's nothing to navigate to yet), and reachable
// only through renderApp()'s auth gate, never a nav link.
Views.login = function(container){
  let submitting = false;
  let error = null;

  function render(){
    container.innerHTML = `
      <div class="login-page">
        <div class="card card-pad login-card">
          <div class="login-brand">
            <div class="wordmark">Smart<span>Inventory</span></div>
            <div class="tagline">Manager</div>
          </div>
          <h1>Sign in</h1>
          <div class="sub" style="margin-bottom:18px">Use your Smart Inventory Manager account to continue.</div>
          ${error ? `<div class="inline-notice warn" style="margin-bottom:14px">${UI.icon('warning')}<span>${UI.esc(error)}</span></div>` : ''}
          <form id="login-form">
            <div class="field">
              <label for="lf-email">Email <span class="req">*</span></label>
              <input type="email" id="lf-email" autocomplete="username" required>
            </div>
            <div class="field">
              <label for="lf-password">Password <span class="req">*</span></label>
              <input type="password" id="lf-password" autocomplete="current-password" required>
            </div>
            <div class="form-actions">
              <button class="btn btn-primary btn-block" type="submit" ${submitting ? 'disabled' : ''}>${submitting ? 'Signing in…' : 'Sign in'}</button>
            </div>
          </form>
        </div>
      </div>`;
    attach();
  }

  function attach(){
    const form = container.querySelector('#login-form');
    form.addEventListener('submit', e => {
      e.preventDefault();
      if (submitting) return;
      const email = container.querySelector('#lf-email').value.trim();
      const password = container.querySelector('#lf-password').value;
      submitting = true;
      error = null;
      render();
      Store.login(email, password)
        .then(() => {
          // Usually a hash change (from '#/login' or empty) fires renderApp() via
          // the hashchange listener on its own — but if the address bar already
          // read '#/dashboard' (e.g. the user typed that URL while logged out),
          // setting the same hash again is a no-op that fires no event, so render
          // directly in that one case instead of leaving the login form on screen.
          if (location.hash === '#/dashboard') renderApp();
          else UI.navigate('#/dashboard');
        })
        .catch(err => {
          submitting = false;
          error = err.message || 'Could not sign in. Please try again.';
          render();
        });
    });
    container.querySelector('#lf-email').focus();
  }

  render();
};
// -------------------------------------------------------------- Dashboard --
// FR-050: the dashboard has no data of its own — it composes counts and a recent
// slice of transactions that already exist in Product/Inventory Transaction.
Views.dashboard = function(container, query){
  let override = 'normal';

  function load(){
    container.innerHTML = skeletonHtml();
    // Phase 1 computed these six numbers from the local PRODUCTS/TRANSACTIONS
    // arrays; Phase 2 gets them pre-composed from one endpoint (GET
    // /dashboard/summary — see DashboardService), matching FR-050's own framing that
    // the dashboard owns no data of its own, it only reads what other modules hold.
    UI.mockFetch(async () => {
      if (override === 'empty'){
        return { activeProductsCount: 0, inactiveProductsCount: 0, lowStockCount: 0, outOfStockCount: 0, transactionsLast7Days: 0, recentActivity: [], needsAttention: [] };
      }
      const summary = await Store.getDashboardSummary();
      return { ...summary, recentActivity: summary.recentActivity.map(normalizeTx) };
    }, { forceState: override === 'error' ? 'error' : null })
      .then(data => { container.innerHTML = contentHtml(data); attach(); })
      .catch(err => { container.innerHTML = headerHtml() + UI.errorState(err.message, 'retry'); attach(); });
  }

  function skeletonHtml(){
    return headerHtml() + `
      <div class="stat-grid">${Array.from({length:4}).map(() => `<div class="stat-tile"><div class="skeleton skeleton-line" style="width:50%"></div><div class="skeleton skeleton-line" style="width:35%;height:26px;margin-top:8px"></div></div>`).join('')}</div>
      <div class="card"><div class="card-header"><h2>Recent Activity</h2></div>
        <div class="table-wrap"><table class="data-table"><tbody>${UI.skeletonRows(4,5)}</tbody></table></div></div>`;
  }

  function headerHtml(){
    return `<div class="content-header">
        <div><h1>Dashboard</h1><div class="sub">A quick health check on inventory — stock levels, alerts, and recent activity.</div></div>
        ${UI.previewControl(override)}
      </div>`;
  }

  function contentHtml(summary){
    const { activeProductsCount, inactiveProductsCount, lowStockCount, outOfStockCount, transactionsLast7Days, recentActivity, needsAttention } = summary;
    return headerHtml() + `
      <div class="stat-grid">
        <a class="stat-tile" href="#/products?status=active">
          <div class="label">Active Products</div>
          <div class="value tnum">${activeProductsCount}</div>
          <div class="foot">${inactiveProductsCount} inactive</div>
        </a>
        <a class="stat-tile" href="#/products?status=low">
          <div class="label">Low Stock</div>
          <div class="value tnum ${lowStockCount ? 'warning' : ''}">${lowStockCount}</div>
          <div class="foot">at or below threshold</div>
        </a>
        <a class="stat-tile" href="#/products?status=out">
          <div class="label">Out of Stock</div>
          <div class="value tnum ${outOfStockCount ? 'critical' : ''}">${outOfStockCount}</div>
          <div class="foot">0 units on hand</div>
        </a>
        <a class="stat-tile" href="#/history">
          <div class="label">Transactions, Last 7 Days</div>
          <div class="value tnum">${transactionsLast7Days}</div>
          <div class="foot">stock-in, stock-out &amp; adjustments</div>
        </a>
      </div>
      <div class="form-grid" style="align-items:start">
        <div class="card">
          <div class="card-header"><h2>Recent Activity</h2><a href="#/history" class="btn btn-ghost btn-sm">View all</a></div>
          ${recentActivity.length === 0 ? UI.emptyState('No recent activity', 'Transactions recorded across your inventory will show up here.') : `
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Product</th><th>Type</th><th>Qty</th><th>When</th><th>By</th></tr></thead>
            <tbody>${recentActivity.map(rowHtml).join('')}</tbody>
          </table></div>`}
        </div>
        <div class="card">
          <div class="card-header"><h2>Needs Attention</h2><a href="#/products?status=low" class="btn btn-ghost btn-sm">View all</a></div>
          ${needsAttention.length === 0 ? UI.emptyState('All caught up', 'No products are currently low on stock.') : `
          <div class="table-wrap"><table class="data-table">
            <thead><tr><th>Product</th><th>Stock</th><th></th></tr></thead>
            <tbody>${needsAttention.map(p => `
              <tr class="clickable" data-goto="#/products/${p.id}">
                <td><div class="cell-name">${UI.esc(p.name)}</div><div class="cell-sub mono">${UI.esc(p.sku)}</div></td>
                <td class="tnum">${p.currentStock} ${UI.esc(p.unit)}</td>
                <td>${UI.badgeStockLevel(p)}</td>
              </tr>`).join('')}
          </table></div>`}
        </div>
      </div>`;
  }

  // t.product/t.recordedBy come pre-joined from the API (see InventoryService.listAll's
  // leftJoinAndSelect) — no separate Store.getProduct/getUser lookups needed anymore.
  function rowHtml(t){
    return `<tr class="clickable" data-goto="#/products/${t.productId}">
      <td><div class="cell-name">${UI.esc(t.product ? t.product.name : 'Unknown product')}</div></td>
      <td>${UI.typeBadge(t.type)}</td>
      <td class="tnum ${t.delta > 0 ? 'qty-pos' : 'qty-neg'}">${UI.fmtQty(t.delta, t.product ? t.product.unit : '')}</td>
      <td class="cell-sub">${UI.fmtDateTime(t.date)}</td>
      <td class="cell-sub">${t.recordedBy ? UI.esc(t.recordedBy.name) : '—'}</td>
    </tr>`;
  }

  function attach(){
    const sel = container.querySelector('#preview-select');
    if (sel) sel.addEventListener('change', e => { override = e.target.value; load(); });
    container.querySelectorAll('[data-goto]').forEach(row => row.addEventListener('click', () => UI.navigate(row.dataset.goto)));
    const retry = container.querySelector('#retry');
    if (retry) retry.addEventListener('click', () => { override = 'normal'; load(); });
  }

  load();
};
