// FR-004 (list & status), FR-042 (low-stock list, via the status filter rather than
// a separate screen — see the UI Decisions write-up for why).
Views.productList = function(container, query){
  let search = '';
  let status = query.get('status') || 'all'; // all | active | inactive | low | out
  let category = query.get('category') || '';
  let override = 'normal';

  function load(){
    container.innerHTML = header() + toolbar() + `<div class="table-wrap"><table class="data-table"><tbody>${UI.skeletonRows(6,6)}</tbody></table></div>`;
    attachHeaderHandlers();
    UI.mockFetch(() => {
      if (override === 'empty') return [];
      // low/out used to be filtered client-side after fetching everything; the API's
      // ?status= now accepts them directly (ProductsService.findAll), so the server
      // does the filtering instead of the browser.
      return Store.listProducts({ search, category: category || undefined, status: status === 'all' ? undefined : status });
    }, { forceState: override === 'error' ? 'error' : null })
      .then(list => { container.innerHTML = header() + toolbar() + body(list); attachAll(); })
      .catch(err => { container.innerHTML = header() + toolbar() + UI.errorState(err.message, 'retry'); attachAll(); });
  }

  function header(){
    // Phase 1 showed a live "N products in the catalog" count here for free (it was
    // just PRODUCTS.length). That count isn't part of any response this screen
    // fetches, and firing an extra unfiltered request purely to caption the page
    // isn't worth it — so the subtitle becomes static copy instead.
    return `<div class="content-header">
      <div><h1>Products</h1><div class="sub">Your full product catalog.</div></div>
      <div class="header-actions"><a class="btn btn-primary" href="#/products/new">${UI.icon('plus')} New Product</a></div>
    </div>`;
  }

  function toolbar(){
    const statusLabel = { all:'All', active:'Active', inactive:'Inactive', low:'Low Stock', out:'Out of Stock' };
    return `<div class="toolbar">
      <div class="search-input">${UI.icon('search')}<input type="text" id="pl-search" placeholder="Search by name or SKU" value="${UI.esc(search)}"></div>
      <select class="select-filter" id="pl-status">
        ${Object.entries(statusLabel).map(([v,l]) => `<option value="${v}" ${v===status?'selected':''}>${l}</option>`).join('')}
      </select>
      <select class="select-filter" id="pl-category">
        <option value="">All categories</option>
        ${CATEGORIES.map(c => `<option value="${c.id}" ${c.id===category?'selected':''}>${UI.esc(c.name)}</option>`).join('')}
      </select>
      ${UI.previewControl(override)}
    </div>`;
  }

  function body(list){
    if (list.length === 0){
      if (override === 'empty') return UI.emptyState('No products yet', 'Add your first product to start tracking stock.');
      return UI.emptyState('No matching products', 'Try a different search term or clear the filters.');
    }
    return `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(rowHtml).join('')}</tbody>
    </table></div>`;
  }

  function rowHtml(p){
    return `<tr class="clickable" data-goto="#/products/${p.id}">
      <td><div class="cell-name">${UI.esc(p.name)}</div><div class="cell-sub mono">${UI.esc(p.sku)}</div></td>
      <td>${UI.catChip(p.categoryId)}</td>
      <td class="tnum">${p.currentStock} ${UI.esc(p.unit)}</td>
      <td>${UI.badgeStatus(p.status)} ${UI.badgeStockLevel(p)}</td>
      <td><a class="btn btn-ghost btn-sm" href="#/products/${p.id}">View</a></td>
    </tr>`;
  }

  function attachHeaderHandlers(){
    const s = container.querySelector('#pl-status');
    if (s) s.addEventListener('change', e => { status = e.target.value; load(); });
    const c = container.querySelector('#pl-category');
    if (c) c.addEventListener('change', e => { category = e.target.value; load(); });
    const p = container.querySelector('#preview-select');
    if (p) p.addEventListener('change', e => { override = e.target.value; load(); });
  }

  function attachAll(){
    attachHeaderHandlers();
    const searchInput = container.querySelector('#pl-search');
    if (searchInput){
      searchInput.addEventListener('input', e => { search = e.target.value; load(); });
      searchInput.focus();
      const val = searchInput.value; searchInput.value = ''; searchInput.value = val;
    }
    container.querySelectorAll('[data-goto]').forEach(row => row.addEventListener('click', () => UI.navigate(row.dataset.goto)));
    const retry = container.querySelector('#retry');
    if (retry) retry.addEventListener('click', () => { override = 'normal'; load(); });
  }

  load();
};
// -------------------------------------------------------------- Product Detail --
// FR-004 (detail), FR-030 (per-product history), FR-006/BR-004 (no delete with history).
Views.productDetail = function(container, id){
  let product = null;
  let history = [];
  let confirmMode = null; // null | 'deactivate' | 'delete'

  // Phase 1 read `product` and its history synchronously off local arrays and never
  // needed to reload them — every mutation just edited the array in place. Phase 2
  // re-fetches both from the API after every mutation instead of hand-patching local
  // state: one extra round trip per action, but it guarantees what's on screen is
  // exactly what the server just committed (including currentStock/lowStock, which
  // only the server can compute).
  function load(){
    container.innerHTML = `<div class="skeleton skeleton-line" style="width:220px;height:24px"></div>`;
    Promise.all([Store.getProduct(id), Store.listTransactionsForProduct(id)])
      .then(([p, h]) => { product = p; history = h; render(); })
      .catch(err => { container.innerHTML = UI.errorState(err.message, 'retry'); container.querySelector('#retry')?.addEventListener('click', load); });
  }

  function render(){
    const cat = Store.getCategory(product.categoryId);
    const inactive = product.status !== 'active';

    container.innerHTML = `
      <div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/products">Products</a> / ${UI.esc(product.name)}</div>
      <div class="detail-hero">
        <div>
          <h1>${UI.esc(product.name)} ${UI.badgeStatus(product.status)} ${UI.badgeStockLevel(product)}</h1>
          <div class="detail-id mono">${UI.esc(product.sku)} · ${cat ? UI.esc(cat.name) : 'Uncategorized'}</div>
          <div class="detail-stock"><span class="num tnum">${product.currentStock}</span><span class="unit">${UI.esc(product.unit)} on hand</span></div>
          <div class="detail-meta">
            <div><span class="k">Low-stock threshold</span>${product.lowStockThreshold === null ? 'Not set — never flagged' : product.lowStockThreshold + ' ' + UI.esc(product.unit)}</div>
            <div><span class="k">Category</span>${cat ? UI.esc(cat.name) : '—'}</div>
          </div>
        </div>
        <div class="header-actions"><a class="btn btn-secondary" href="#/products/${product.id}/edit">Edit</a></div>
      </div>

      ${inactive ? `<div class="inline-notice warn" style="margin-bottom:20px">${UI.icon('warning')}<div>This product is <strong>inactive</strong>. Reactivate it to record stock-in or stock-out — adjustments are still allowed (e.g. to finalize a closing count).</div></div>` : ''}

      <div class="action-row">
        <a class="btn btn-primary" ${inactive ? 'aria-disabled="true" tabindex="-1" style="pointer-events:none;opacity:.5"' : `href="#/products/${product.id}/stock-in"`}>Stock In</a>
        <a class="btn btn-secondary" ${inactive ? 'aria-disabled="true" tabindex="-1" style="pointer-events:none;opacity:.5"' : `href="#/products/${product.id}/stock-out"`}>Stock Out</a>
        <a class="btn btn-secondary" href="#/products/${product.id}/adjust">Adjust Stock</a>
        <span style="flex:1"></span>
        ${lifecycleControls(inactive)}
      </div>

      <h2 class="section-title">Transaction History</h2>
      ${history.length > 0 ? `<div class="table-wrap"><table class="data-table">
        <thead><tr><th>Date</th><th>Type</th><th>Qty</th><th>Supplier / Reason</th><th>By</th></tr></thead>
        <tbody>${history.map(historyRow).join('')}</tbody>
      </table></div>` : UI.emptyState('No transactions yet', 'This product was just added — record a Stock In to receive its first units.')}
    `;
    attach();
  }

  function lifecycleControls(inactive){
    if (confirmMode === 'deactivate'){
      return `<div class="confirm-inline">Deactivate ${UI.esc(product.name)}? It will be hidden from new stock-in/out.
        <button class="btn btn-ghost btn-sm" id="cancel-confirm">Cancel</button>
        <button class="btn btn-danger btn-sm" id="do-deactivate">Yes, deactivate</button></div>`;
    }
    if (confirmMode === 'delete'){
      return `<div class="confirm-inline">Permanently delete ${UI.esc(product.name)}? This cannot be undone.
        <button class="btn btn-ghost btn-sm" id="cancel-confirm">Cancel</button>
        <button class="btn btn-danger btn-sm" id="do-delete">Yes, delete</button></div>`;
    }
    const toggle = inactive
      ? `<button class="btn btn-secondary" id="btn-activate">Reactivate</button>`
      : `<button class="btn btn-secondary" id="btn-deactivate">Deactivate</button>`;
    const del = product.hasHistory
      ? `<button class="btn btn-danger" disabled title="Products with transaction history can't be deleted — deactivate instead">Delete</button>`
      : `<button class="btn btn-danger" id="btn-delete">Delete</button>`;
    return toggle + del;
  }

  // t.supplier/t.recordedBy arrive pre-normalized (see normalizeTx) from the API's
  // joined relations — no separate Store.getSupplier/getUser lookups needed anymore.
  function historyRow(t){
    const detail = t.type === 'stock-in'
      ? (t.supplier ? UI.esc(t.supplier.name) : '<span class="cell-sub">No supplier recorded</span>')
      : (t.reason ? UI.esc(t.reason) : '<span class="cell-sub">—</span>');
    return `<tr>
      <td class="cell-sub">${UI.fmtDateTime(t.date)}</td>
      <td>${UI.typeBadge(t.type)}</td>
      <td class="tnum ${t.delta > 0 ? 'qty-pos' : 'qty-neg'}">${UI.fmtQty(t.delta, product.unit)}</td>
      <td>${detail}</td>
      <td class="cell-sub">${t.recordedBy ? UI.esc(t.recordedBy.name) : '—'}</td>
    </tr>`;
  }

  function attach(){
    const cancel = container.querySelector('#cancel-confirm');
    if (cancel) cancel.addEventListener('click', () => { confirmMode = null; render(); });
    const deact = container.querySelector('#btn-deactivate');
    if (deact) deact.addEventListener('click', () => { confirmMode = 'deactivate'; render(); });
    const doDeact = container.querySelector('#do-deactivate');
    if (doDeact) doDeact.addEventListener('click', () => {
      Store.setProductStatus(product.id, 'inactive')
        .then(() => { confirmMode = null; UI.toast(`${product.name} deactivated.`); return load(); })
        .catch(err => UI.toast(err.message, 'error'));
    });
    const act = container.querySelector('#btn-activate');
    if (act) act.addEventListener('click', () => {
      Store.setProductStatus(product.id, 'active')
        .then(() => { UI.toast(`${product.name} reactivated.`, 'success'); return load(); })
        .catch(err => UI.toast(err.message, 'error'));
    });
    const del = container.querySelector('#btn-delete');
    if (del) del.addEventListener('click', () => { confirmMode = 'delete'; render(); });
    const doDel = container.querySelector('#do-delete');
    if (doDel) doDel.addEventListener('click', () => {
      Store.deleteProduct(product.id)
        .then(() => { UI.toast(`${product.name} deleted.`, 'success'); UI.navigate('#/products'); })
        .catch(err => { confirmMode = null; UI.toast(err.message, 'error'); render(); });
    });
  }

  load();
};
// -------------------------------------------------------------- Product Form --
// FR-001 (create), FR-002 (edit — SKU locked once history exists, per BR-001).
Views.productForm = function(container, id){
  const editing = !!id;
  let product = null;
  let skuLocked = false;
  const state = { name: '', sku: '', unit: '', categoryId: '', threshold: '' };
  let errors = {};

  // Editing needs the product fetched first (for its current values AND its
  // hasHistory flag, which decides skuLocked) before there's anything to render;
  // creating doesn't need a fetch at all.
  function load(){
    if (!editing){ render(); return; }
    container.innerHTML = `<div class="skeleton skeleton-line" style="width:220px;height:24px"></div>`;
    Store.getProduct(id).then(p => {
      product = p;
      skuLocked = p.hasHistory;
      state.name = p.name; state.sku = p.sku; state.unit = p.unit;
      state.categoryId = p.categoryId || '';
      state.threshold = p.lowStockThreshold !== null ? String(p.lowStockThreshold) : '';
      render();
    }).catch(err => { container.innerHTML = UI.errorState(err.message, 'retry'); container.querySelector('#retry')?.addEventListener('click', load); });
  }

  function render(){
    container.innerHTML = `
      <div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/products">Products</a> / ${editing ? UI.esc(product.name) : 'New Product'}</div>
      <div class="content-header"><div><h1>${editing ? 'Edit Product' : 'New Product'}</h1>
        <div class="sub">${editing ? 'SKU and identity details.' : 'Every product needs a name, SKU, and unit of measurement before it can be used in a transaction.'}</div></div></div>
      <div class="card card-pad" style="max-width:640px">
        <form id="product-form" novalidate>
          <div class="form-grid">
            <div class="field${errors.name ? ' has-error' : ''}">
              <label>Name <span class="req">*</span></label>
              <input type="text" id="f-name" value="${UI.esc(state.name)}" placeholder="e.g. Espresso Beans, 1kg">
              ${errors.name ? `<div class="error">${errors.name}</div>` : ''}
            </div>
            <div class="field${errors.sku ? ' has-error' : ''}">
              <label>SKU <span class="req">*</span></label>
              <input type="text" id="f-sku" value="${UI.esc(state.sku)}" placeholder="e.g. CO-1001" ${skuLocked ? 'disabled' : ''}>
              ${skuLocked ? `<div class="hint">Locked — this product has transaction history (BR-001).</div>` : ''}
              ${errors.sku ? `<div class="error">${errors.sku}</div>` : ''}
            </div>
          </div>
          <div class="form-grid">
            <div class="field${errors.unit ? ' has-error' : ''}">
              <label>Unit of Measurement <span class="req">*</span></label>
              <input type="text" id="f-unit" value="${UI.esc(state.unit)}" placeholder="e.g. bag, box, case">
              ${errors.unit ? `<div class="error">${errors.unit}</div>` : ''}
            </div>
            <div class="field">
              <label>Category</label>
              <select id="f-category">
                <option value="">— None —</option>
                ${CATEGORIES.map(c => `<option value="${c.id}" ${c.id===state.categoryId?'selected':''}>${UI.esc(c.name)}</option>`).join('')}
              </select>
            </div>
          </div>
          <div class="field${errors.threshold ? ' has-error' : ''}" style="max-width:260px">
            <label>Low-Stock Threshold</label>
            <input type="number" id="f-threshold" min="0" step="1" value="${UI.esc(state.threshold)}" placeholder="Leave blank for none">
            <div class="hint">Flagged low-stock when stock falls at or below this number. Leave blank to never flag this product.</div>
            ${errors.threshold ? `<div class="error">${errors.threshold}</div>` : ''}
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">${editing ? 'Save Changes' : 'Create Product'}</button>
            <a class="btn btn-secondary" href="${editing ? '#/products/' + product.id : '#/products'}">Cancel</a>
          </div>
        </form>
      </div>`;
    attach();
  }

  function readForm(){
    state.name = container.querySelector('#f-name').value;
    state.sku = skuLocked ? state.sku : container.querySelector('#f-sku').value;
    state.unit = container.querySelector('#f-unit').value;
    state.categoryId = container.querySelector('#f-category').value;
    state.threshold = container.querySelector('#f-threshold').value;
  }

  function validate(){
    // SKU uniqueness used to be checked here too (Store.skuExists against the local
    // PRODUCTS array). Uniqueness is a database constraint now (BR-001 — see the
    // unique index in the InitSchema migration), so it can only be checked by
    // actually asking the server; see the submit handler's .catch() below for how
    // that 409 becomes an inline field error instead of just a toast.
    const e = {};
    if (!state.name.trim()) e.name = 'Name is required.';
    if (!state.sku.trim()) e.sku = 'SKU is required.';
    if (!state.unit.trim()) e.unit = 'Unit of measurement is required.';
    if (state.threshold !== '' && (!Number.isInteger(Number(state.threshold)) || Number(state.threshold) < 0)) {
      e.threshold = 'Enter a whole number, 0 or greater, or leave blank.';
    }
    return e;
  }

  function attach(){
    container.querySelector('#product-form').addEventListener('submit', e => {
      e.preventDefault();
      readForm();
      errors = validate();
      if (Object.keys(errors).length){ render(); return; }
      const submitBtn = container.querySelector('#product-form button[type=submit]');
      submitBtn.disabled = true;
      const save = editing ? Store.updateProduct(id, state) : Store.createProduct(state);
      save.then(result => {
        UI.toast(editing ? 'Product updated.' : 'Product created.', 'success');
        UI.navigate('#/products/' + (editing ? id : result.id));
      }).catch(err => {
        errors = /sku/i.test(err.message) ? { sku: err.message } : {};
        if (Object.keys(errors).length === 0) UI.toast(err.message, 'error');
        render();
      });
    });
  }

  load();
};
// -------------------------------------------------------------- Transaction Wizard --
// Shared by Stock In (FR-020), Stock Out (FR-021), and Adjustment (FR-022) — the three
// are really one "record a transaction" flow with different fields, so one function
// handles all three rather than duplicating the step machinery three times.
const REASON_OPTIONS = [
  ['stocktake', 'Stocktake discrepancy'],
  ['damaged', 'Damaged'],
  ['lost', 'Lost / theft'],
  ['correction', 'Data-entry correction'],
  ['other', 'Other'],
];
const TITLES = { 'stock-in': 'Stock In', 'stock-out': 'Stock Out', 'adjustment': 'Adjust Stock' };

Views.transactionWizard = function(container, productId, type){
  let product = null;
  let activeSuppliers = []; // only fetched/used for type === 'stock-in'
  let step = 'form'; // form | review | success
  let saving = false;
  let savedTx = null;
  const form = {
    quantity: '', newQty: '', date: todayInputValue(), supplierId: '',
    reason: '', reasonCategory: '', reasonOther: '',
  };
  let errors = {};

  // Both the product (for its name/unit/currentStock/status) and, for stock-in, the
  // active-supplier list have to be fetched before there's a form to show at all —
  // Phase 1 had both sitting in local arrays already, so this loading step didn't
  // exist yet.
  function load(){
    container.innerHTML = `<div class="skeleton skeleton-line" style="width:220px;height:24px"></div>`;
    Promise.all([
      Store.getProduct(productId),
      type === 'stock-in' ? Store.listSuppliers({ status: 'active' }) : Promise.resolve([]),
    ]).then(([p, suppliers]) => {
      product = p; activeSuppliers = suppliers;
      render();
    }).catch(err => { container.innerHTML = UI.errorState(err.message, 'retry'); container.querySelector('#retry')?.addEventListener('click', load); });
  }

  function render(){
    if (product.status !== 'active' && type !== 'adjustment'){
      container.innerHTML = `
        <div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/products/${product.id}">${UI.esc(product.name)}</a> / ${TITLES[type]}</div>
        <div class="inline-notice warn">${UI.icon('warning')}<div><strong>${UI.esc(product.name)}</strong> is inactive. Reactivate it from the product page before recording stock in or out.</div></div>
        <div style="margin-top:16px"><a class="btn btn-secondary" href="#/products/${product.id}">Back to Product</a></div>`;
      return;
    }
    if (step === 'form') container.innerHTML = crumbs() + steps() + formHtml();
    else if (step === 'review') container.innerHTML = crumbs() + steps() + reviewHtml();
    else container.innerHTML = crumbs() + successHtml();
    attach();
  }

  function crumbs(){
    return `<div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/products/${product.id}">${UI.esc(product.name)}</a> / ${TITLES[type]}</div>`;
  }
  function steps(){
    const s = step;
    const st = (key, n, label) => `<div class="step ${s===key?'active':(s==='review'&&key==='form')?'done':''}"><div class="dot">${(s==='review'&&key==='form') ? '✓' : n}</div>${label}</div>`;
    return `<div class="wizard-steps">${st('form',1,'Enter Details')}<div class="sep"></div>${st('review',2,'Review &amp; Confirm')}</div>`;
  }

  function formHtml(){
    const current = product.currentStock;
    return `<div class="wizard-wrap">
      <div class="card card-pad">
        <p style="margin-bottom:16px;color:var(--ink-muted);font-size:.85rem">Current stock: <strong class="tnum" style="color:var(--ink)">${current} ${UI.esc(product.unit)}</strong></p>
        <form id="wizard-form" novalidate>
          ${type === 'adjustment' ? adjustmentFields() : inOutFields(activeSuppliers)}
          <div class="field${errors.date ? ' has-error' : ''}">
            <label>Date <span class="req">*</span></label>
            <input type="date" id="f-date" value="${UI.esc(form.date)}" max="${todayInputValue()}">
            ${errors.date ? `<div class="error">${errors.date}</div>` : ''}
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Continue to Review</button>
            <a class="btn btn-secondary" href="#/products/${product.id}">Cancel</a>
          </div>
        </form>
      </div>
    </div>`;
  }

  function inOutFields(activeSuppliers){
    return `
      <div class="field${errors.quantity ? ' has-error' : ''}">
        <label>Quantity (${UI.esc(product.unit)}) <span class="req">*</span></label>
        <input type="number" id="f-quantity" min="1" step="1" value="${UI.esc(form.quantity)}" placeholder="0">
        ${errors.quantity ? `<div class="error">${errors.quantity}</div>` : `<div class="hint">Enter a whole number greater than 0.</div>`}
      </div>
      ${type === 'stock-in' ? `
      <div class="field">
        <label>Supplier</label>
        <select id="f-supplier">
          <option value="">— No supplier recorded —</option>
          ${activeSuppliers.map(s => `<option value="${s.id}" ${s.id===form.supplierId?'selected':''}>${UI.esc(s.name)}</option>`).join('')}
        </select>
        <div class="hint">Optional — inactive suppliers can't be selected (FR-013).</div>
      </div>` : `
      <div class="field">
        <label>Reason</label>
        <input type="text" id="f-reason" value="${UI.esc(form.reason)}" placeholder="Optional, e.g. Sold at counter">
      </div>`}
    `;
  }

  function adjustmentFields(){
    const current = product.currentStock;
    return `
      <div class="field${errors.newQty ? ' has-error' : ''}">
        <label>New Counted Quantity (${UI.esc(product.unit)}) <span class="req">*</span></label>
        <input type="number" id="f-newqty" min="0" step="1" value="${UI.esc(form.newQty)}" placeholder="${current}">
        ${errors.newQty ? `<div class="error">${errors.newQty}</div>` : `<div class="hint">Enter the actual physical count — the change is calculated for you.</div>`}
      </div>
      <div class="field${errors.reasonCategory ? ' has-error' : ''}">
        <label>Reason <span class="req">*</span></label>
        <select id="f-reason-cat">
          <option value="">— Select a reason —</option>
          ${REASON_OPTIONS.map(([v,l]) => `<option value="${v}" ${v===form.reasonCategory?'selected':''}>${l}</option>`).join('')}
        </select>
        ${errors.reasonCategory ? `<div class="error">${errors.reasonCategory}</div>` : ''}
      </div>
      ${form.reasonCategory === 'other' ? `
      <div class="field${errors.reasonOther ? ' has-error' : ''}">
        <label>Describe the Reason <span class="req">*</span></label>
        <input type="text" id="f-reason-other" value="${UI.esc(form.reasonOther)}" placeholder="e.g. Vendor shipped 2 extra units">
        ${errors.reasonOther ? `<div class="error">${errors.reasonOther}</div>` : ''}
      </div>` : ''}
    `;
  }

  function computeDelta(){
    const current = product.currentStock;
    if (type === 'adjustment') return Number(form.newQty) - current;
    const q = Number(form.quantity);
    return type === 'stock-out' ? -q : q;
  }

  function reviewHtml(){
    const current = product.currentStock;
    const delta = computeDelta();
    const after = current + delta;
    const reasonText = type === 'adjustment'
      ? (form.reasonCategory === 'other' ? form.reasonOther : (REASON_OPTIONS.find(r => r[0] === form.reasonCategory) || [,''])[1])
      : form.reason;
    const supplierName = form.supplierId ? activeSuppliers.find(s => String(s.id) === String(form.supplierId))?.name : null;
    return `<div class="wizard-wrap">
      <div class="card card-pad">
        <div class="review-card">
          <div class="review-row"><span class="k">Product</span><span class="v">${UI.esc(product.name)}</span></div>
          <div class="review-row"><span class="k">Type</span><span class="v">${TITLES[type]}</span></div>
          <div class="review-row"><span class="k">Date</span><span class="v">${UI.esc(form.date)}</span></div>
          ${type === 'stock-in' ? `<div class="review-row"><span class="k">Supplier</span><span class="v">${supplierName ? UI.esc(supplierName) : 'None recorded'}</span></div>` : ''}
          ${reasonText ? `<div class="review-row"><span class="k">Reason</span><span class="v">${UI.esc(reasonText)}</span></div>` : ''}
        </div>
        <div class="review-highlight">
          <div><div class="cell-sub">Before</div><div class="tnum" style="font-weight:700">${current} ${UI.esc(product.unit)}</div></div>
          <div class="arrow">→</div>
          <div><div class="cell-sub">Change</div><div class="tnum ${delta>0?'qty-pos':'qty-neg'}" style="font-weight:700">${UI.fmtQty(delta, '')}</div></div>
          <div class="arrow">→</div>
          <div><div class="cell-sub">After</div><div class="tnum" style="font-weight:700">${after} ${UI.esc(product.unit)}</div></div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="btn-confirm" ${saving ? 'disabled' : ''}>${saving ? 'Saving…' : 'Confirm & Save'}</button>
          <button class="btn btn-secondary" id="btn-back">Back</button>
        </div>
      </div>
    </div>`;
  }

  function successHtml(){
    // product was re-fetched right after the save succeeded (see the confirm handler
    // below), so product.currentStock here is already the real post-transaction
    // total from the server — not a client-side + delta guess.
    const after = product.currentStock;
    return `<div class="wizard-wrap">
      <div class="success-panel">
        <div class="icon-circle">${UI.icon('check')}</div>
        <h3>${TITLES[type]} recorded</h3>
        <p>${UI.esc(product.name)} is now at <strong class="tnum">${after} ${UI.esc(product.unit)}</strong>.</p>
        <div class="form-actions">
          <a class="btn btn-primary" href="#/products/${product.id}">Back to Product</a>
          <button class="btn btn-secondary" id="btn-again">Record Another ${TITLES[type]}</button>
        </div>
      </div>
    </div>`;
  }

  function readForm(){
    if (type === 'adjustment'){
      form.newQty = container.querySelector('#f-newqty').value;
      form.reasonCategory = container.querySelector('#f-reason-cat').value;
      const other = container.querySelector('#f-reason-other');
      if (other) form.reasonOther = other.value;
    } else {
      form.quantity = container.querySelector('#f-quantity').value;
      if (type === 'stock-in') form.supplierId = container.querySelector('#f-supplier').value;
      else form.reason = container.querySelector('#f-reason').value;
    }
    form.date = container.querySelector('#f-date').value;
  }

  function validate(){
    const e = {};
    const current = product.currentStock;
    if (type === 'adjustment'){
      const n = Number(form.newQty);
      if (form.newQty === '' || !Number.isInteger(n) || n < 0) e.newQty = 'Enter a whole number, 0 or greater.';
      if (!form.reasonCategory) e.reasonCategory = 'Select a reason.';
      else if (form.reasonCategory === 'other' && !form.reasonOther.trim()) e.reasonOther = 'Describe the reason.';
    } else {
      const n = Number(form.quantity);
      if (form.quantity === '' || !Number.isInteger(n) || n <= 0) e.quantity = 'Enter a whole number greater than 0.';
      else if (type === 'stock-out' && n > current) e.quantity = `Only ${current} ${product.unit} available — cannot remove ${n}.`;
    }
    if (!form.date) e.date = 'Select a date.';
    else if (form.date > todayInputValue()) e.date = 'Date cannot be in the future.';
    return e;
  }

  function attach(){
    if (step === 'form'){
      const f = container.querySelector('#wizard-form');
      f.addEventListener('submit', ev => {
        ev.preventDefault();
        readForm();
        errors = validate();
        if (Object.keys(errors).length){ render(); return; }
        step = 'review'; render();
      });
      const rc = container.querySelector('#f-reason-cat');
      // Sync every field from the DOM before re-rendering — otherwise the fields we
      // don't explicitly track here (quantity/date already typed) would be wiped out
      // by the next render, which rebuilds the form HTML from `form` state.
      if (rc) rc.addEventListener('change', () => { readForm(); render(); container.querySelector('#f-reason-cat')?.focus(); });
    } else if (step === 'review'){
      container.querySelector('#btn-back').addEventListener('click', () => { step = 'form'; render(); });
      container.querySelector('#btn-confirm').addEventListener('click', () => {
        saving = true; render();
        // Phase 1 had one Store.createTransaction({ type, ... }) dispatcher; Phase 2
        // maps directly onto the three REST actions instead (POST .../stock-in,
        // .../stock-out, .../adjustments) — see Store, above.
        let call;
        if (type === 'stock-in') call = Store.recordStockIn(product.id, { quantity: form.quantity, date: form.date, supplierId: form.supplierId });
        else if (type === 'stock-out') call = Store.recordStockOut(product.id, { quantity: form.quantity, date: form.date, reason: form.reason });
        else call = Store.recordAdjustment(product.id, {
          newQty: form.newQty, date: form.date,
          reason: form.reasonCategory === 'other' ? form.reasonOther : REASON_OPTIONS.find(r => r[0] === form.reasonCategory)[1],
        });
        call
          // Re-fetch the product so successHtml's "now at N units" reflects the
          // server's authoritative post-transaction stock, not a client-side guess.
          .then(tx => Store.getProduct(product.id).then(p => { product = p; return tx; }))
          .then(tx => {
            savedTx = tx; saving = false; step = 'success';
            UI.toast(`${TITLES[type]} recorded for ${product.name}.`, 'success');
            render();
          }).catch(err => { saving = false; UI.toast(err.message, 'error'); render(); });
      });
    } else {
      const again = container.querySelector('#btn-again');
      if (again) again.addEventListener('click', () => {
        step = 'form'; savedTx = null; errors = {};
        form.quantity = ''; form.newQty = ''; form.date = todayInputValue();
        form.supplierId = ''; form.reason = ''; form.reasonCategory = ''; form.reasonOther = '';
        render();
      });
    }
  }

  load();
};
// -------------------------------------------------------------- Global History --
// FR-031: every transaction across every product, immutable (BR-051) — so this is a
// pure read/filter view with no edit or delete affordance anywhere on it.
Views.historyView = function(container, query){
  let type = '';
  let productId = '';
  let days = '';
  let override = 'normal';
  // Populated once (see load()) to fill the "product" filter dropdown — Phase 1 had
  // this list in memory for free; Phase 2 fetches it once and reuses it across
  // filter changes instead of re-fetching on every load().
  let productOptions = [];

  function load(){
    container.innerHTML = header() + toolbar() + `<div class="table-wrap"><table class="data-table"><tbody>${UI.skeletonRows(6,7)}</tbody></table></div>`;
    attachHeaderHandlers();
    UI.mockFetch(async () => {
      if (override === 'empty') return [];
      const [products, list] = await Promise.all([
        productOptions.length ? productOptions : Store.listProducts({}),
        Store.listAllTransactions({ type: type || undefined, productId: productId || undefined, days: days ? Number(days) : undefined }),
      ]);
      productOptions = products;
      return list;
    }, { forceState: override === 'error' ? 'error' : null })
      .then(list => { container.innerHTML = header() + toolbar() + body(list); attachAll(); })
      .catch(err => { container.innerHTML = header() + toolbar() + UI.errorState(err.message, 'retry'); attachAll(); });
  }

  function header(){
    return `<div class="content-header"><div><h1>Inventory History</h1><div class="sub">Every stock-in, stock-out, and adjustment across all products. Records are permanent — corrections happen only through a new adjustment.</div></div></div>`;
  }

  function toolbar(){
    return `<div class="toolbar">
      <select class="select-filter" id="h-type">
        <option value="">All types</option>
        <option value="stock-in" ${type==='stock-in'?'selected':''}>Stock In</option>
        <option value="stock-out" ${type==='stock-out'?'selected':''}>Stock Out</option>
        <option value="adjustment" ${type==='adjustment'?'selected':''}>Adjustment</option>
      </select>
      <select class="select-filter" id="h-product">
        <option value="">All products</option>
        ${productOptions.map(p => `<option value="${p.id}" ${String(p.id)===String(productId)?'selected':''}>${UI.esc(p.name)}</option>`).join('')}
      </select>
      <select class="select-filter" id="h-days">
        <option value="">All time</option>
        <option value="7" ${days==='7'?'selected':''}>Last 7 days</option>
        <option value="30" ${days==='30'?'selected':''}>Last 30 days</option>
        <option value="90" ${days==='90'?'selected':''}>Last 90 days</option>
      </select>
      ${UI.previewControl(override)}
    </div>`;
  }

  function body(list){
    if (list.length === 0){
      return UI.emptyState(override === 'empty' ? 'No transactions recorded' : 'No matching transactions', override === 'empty' ? 'Stock movements will appear here once recorded.' : 'Try a different filter combination.');
    }
    return `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>Date</th><th>Product</th><th>Type</th><th>Qty</th><th>Supplier / Reason</th><th>By</th></tr></thead>
      <tbody>${list.map(rowHtml).join('')}</tbody>
    </table></div>`;
  }

  function rowHtml(t){
    const detail = t.type === 'stock-in'
      ? (t.supplier ? UI.esc(t.supplier.name) : '<span class="cell-sub">No supplier recorded</span>')
      : (t.reason ? UI.esc(t.reason) : '<span class="cell-sub">—</span>');
    return `<tr class="clickable" data-goto="#/products/${t.productId}">
      <td class="cell-sub">${UI.fmtDateTime(t.date)}</td>
      <td class="cell-name">${UI.esc(t.product ? t.product.name : 'Unknown')}</td>
      <td>${UI.typeBadge(t.type)}</td>
      <td class="tnum ${t.delta>0?'qty-pos':'qty-neg'}">${UI.fmtQty(t.delta, t.product ? t.product.unit : '')}</td>
      <td>${detail}</td>
      <td class="cell-sub">${t.recordedBy ? UI.esc(t.recordedBy.name) : '—'}</td>
    </tr>`;
  }

  function attachHeaderHandlers(){
    const t = container.querySelector('#h-type'); if (t) t.addEventListener('change', e => { type = e.target.value; load(); });
    const p = container.querySelector('#h-product'); if (p) p.addEventListener('change', e => { productId = e.target.value; load(); });
    const d = container.querySelector('#h-days'); if (d) d.addEventListener('change', e => { days = e.target.value; load(); });
    const pr = container.querySelector('#preview-select'); if (pr) pr.addEventListener('change', e => { override = e.target.value; load(); });
  }
  function attachAll(){
    attachHeaderHandlers();
    container.querySelectorAll('[data-goto]').forEach(row => row.addEventListener('click', () => UI.navigate(row.dataset.goto)));
    const retry = container.querySelector('#retry'); if (retry) retry.addEventListener('click', () => { override = 'normal'; load(); });
  }

  load();
};

// FR-012/FR-013.
Views.supplierList = function(container, query){
  let search = '';
  let status = '';
  let override = 'normal';

  function load(){
    container.innerHTML = header() + toolbar() + `<div class="table-wrap"><table class="data-table"><tbody>${UI.skeletonRows(4,4)}</tbody></table></div>`;
    attachHeaderHandlers();
    UI.mockFetch(() => override === 'empty' ? [] : Store.listSuppliers({ search, status: status || undefined }),
      { forceState: override === 'error' ? 'error' : null })
      .then(list => { container.innerHTML = header() + toolbar() + body(list); attachAll(); })
      .catch(err => { container.innerHTML = header() + toolbar() + UI.errorState(err.message, 'retry'); attachAll(); });
  }

  function header(){
    return `<div class="content-header">
      <div><h1>Suppliers</h1><div class="sub">Every supplier on file.</div></div>
      <div class="header-actions"><a class="btn btn-primary" href="#/suppliers/new">${UI.icon('plus')} New Supplier</a></div>
    </div>`;
  }
  function toolbar(){
    return `<div class="toolbar">
      <div class="search-input">${UI.icon('search')}<input type="text" id="sl-search" placeholder="Search suppliers" value="${UI.esc(search)}"></div>
      <select class="select-filter" id="sl-status">
        <option value="">All</option>
        <option value="active" ${status==='active'?'selected':''}>Active</option>
        <option value="inactive" ${status==='inactive'?'selected':''}>Inactive</option>
      </select>
      ${UI.previewControl(override)}
    </div>`;
  }
  function body(list){
    if (list.length === 0) return UI.emptyState(override==='empty' ? 'No suppliers yet' : 'No matching suppliers', override==='empty' ? 'Add a supplier to start linking them to stock-in.' : 'Try a different search or filter.');
    return `<div class="table-wrap"><table class="data-table">
      <thead><tr><th>Supplier</th><th>Contact</th><th>Status</th><th></th></tr></thead>
      <tbody>${list.map(s => `<tr class="clickable" data-goto="#/suppliers/${s.id}">
        <td class="cell-name">${UI.esc(s.name)}</td>
        <td><div>${UI.esc(s.contactName || '—')}</div><div class="cell-sub">${UI.esc(s.email || '')}</div></td>
        <td>${UI.badgeStatus(s.status)}</td>
        <td><a class="btn btn-ghost btn-sm" href="#/suppliers/${s.id}">View</a></td>
      </tr>`).join('')}</tbody></table></div>`;
  }
  function attachHeaderHandlers(){
    const s = container.querySelector('#sl-status'); if (s) s.addEventListener('change', e => { status = e.target.value; load(); });
    const p = container.querySelector('#preview-select'); if (p) p.addEventListener('change', e => { override = e.target.value; load(); });
  }
  function attachAll(){
    attachHeaderHandlers();
    const search_ = container.querySelector('#sl-search');
    if (search_){ search_.addEventListener('input', e => { search = e.target.value; load(); }); search_.focus(); const v = search_.value; search_.value=''; search_.value=v; }
    container.querySelectorAll('[data-goto]').forEach(row => row.addEventListener('click', () => UI.navigate(row.dataset.goto)));
    const retry = container.querySelector('#retry'); if (retry) retry.addEventListener('click', () => { override='normal'; load(); });
  }
  load();
};

Views.supplierDetail = function(container, id){
  let supplier = null;
  let txs = [];
  let confirmMode = null;

  function load(){
    container.innerHTML = `<div class="skeleton skeleton-line" style="width:220px;height:24px"></div>`;
    Promise.all([Store.getSupplierById(id), Store.listTransactionsForSupplier(id)])
      .then(([s, t]) => { supplier = s; txs = t; render(); })
      .catch(err => { container.innerHTML = UI.errorState(err.message, 'retry'); container.querySelector('#retry')?.addEventListener('click', load); });
  }

  function render(){
    container.innerHTML = `
      <div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/suppliers">Suppliers</a> / ${UI.esc(supplier.name)}</div>
      <div class="detail-hero">
        <div>
          <h1>${UI.esc(supplier.name)} ${UI.badgeStatus(supplier.status)}</h1>
          <div class="detail-meta">
            <div><span class="k">Contact</span>${UI.esc(supplier.contactName || '—')}</div>
            <div><span class="k">Email</span>${UI.esc(supplier.email || '—')}</div>
            <div><span class="k">Phone</span>${UI.esc(supplier.phone || '—')}</div>
          </div>
        </div>
        <div class="header-actions"><a class="btn btn-secondary" href="#/suppliers/${supplier.id}/edit">Edit</a></div>
      </div>
      <div class="action-row">
        ${confirmMode === 'toggle' ? `<div class="confirm-inline">${supplier.status==='active' ? 'Deactivate' : 'Reactivate'} ${UI.esc(supplier.name)}?
            <button class="btn btn-ghost btn-sm" id="cancel-confirm">Cancel</button>
            <button class="btn btn-danger btn-sm" id="do-toggle">Confirm</button></div>`
          : `<button class="btn btn-secondary" id="btn-toggle">${supplier.status==='active' ? 'Deactivate' : 'Reactivate'}</button>`}
      </div>
      <h2 class="section-title">Stock Received From This Supplier</h2>
      ${txs.length === 0 ? UI.emptyState('No stock-in recorded', 'Transactions that reference this supplier will show up here.') : `
      <div class="table-wrap"><table class="data-table">
        <thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Recorded By</th></tr></thead>
        <tbody>${txs.map(t => `<tr class="clickable" data-goto="#/products/${t.productId}">
            <td class="cell-sub">${UI.fmtDateTime(t.date)}</td>
            <td class="cell-name">${UI.esc(t.product ? t.product.name : 'Unknown')}</td>
            <td class="tnum qty-pos">${UI.fmtQty(t.delta, t.product ? t.product.unit : '')}</td>
            <td class="cell-sub">${t.recordedBy ? UI.esc(t.recordedBy.name) : '—'}</td>
          </tr>`).join('')}</tbody></table></div>`}
    `;
    attach();
  }
  function attach(){
    const cancel = container.querySelector('#cancel-confirm'); if (cancel) cancel.addEventListener('click', () => { confirmMode = null; render(); });
    const toggle = container.querySelector('#btn-toggle'); if (toggle) toggle.addEventListener('click', () => { confirmMode = 'toggle'; render(); });
    const doToggle = container.querySelector('#do-toggle'); if (doToggle) doToggle.addEventListener('click', () => {
      const next = supplier.status === 'active' ? 'inactive' : 'active';
      Store.setSupplierStatus(supplier.id, next)
        .then(() => { confirmMode = null; UI.toast(`${supplier.name} ${next === 'active' ? 'reactivated' : 'deactivated'}.`, 'success'); return load(); })
        .catch(err => UI.toast(err.message, 'error'));
    });
    container.querySelectorAll('[data-goto]').forEach(row => row.addEventListener('click', () => UI.navigate(row.dataset.goto)));
  }
  load();
};

// FR-010/FR-011.
Views.supplierForm = function(container, id){
  const editing = !!id;
  let supplier = null;
  const state = { name: '', contact: '', email: '', phone: '' };
  let errors = {};

  function load(){
    if (!editing){ render(); return; }
    container.innerHTML = `<div class="skeleton skeleton-line" style="width:220px;height:24px"></div>`;
    Store.getSupplierById(id).then(s => {
      supplier = s;
      state.name = s.name; state.contact = s.contactName || ''; state.email = s.email || ''; state.phone = s.phone || '';
      render();
    }).catch(err => { container.innerHTML = UI.errorState(err.message, 'retry'); container.querySelector('#retry')?.addEventListener('click', load); });
  }

  function render(){
    container.innerHTML = `
      <div class="topbar-crumbs" style="margin-bottom:10px"><a href="#/suppliers">Suppliers</a> / ${editing ? UI.esc(supplier.name) : 'New Supplier'}</div>
      <div class="content-header"><div><h1>${editing ? 'Edit Supplier' : 'New Supplier'}</h1></div></div>
      <div class="card card-pad" style="max-width:640px">
        <form id="supplier-form" novalidate>
          <div class="field${errors.name ? ' has-error' : ''}">
            <label>Supplier Name <span class="req">*</span></label>
            <input type="text" id="f-name" value="${UI.esc(state.name)}" placeholder="e.g. Highland Roasters">
            ${errors.name ? `<div class="error">${errors.name}</div>` : ''}
          </div>
          <div class="form-grid">
            <div class="field"><label>Contact Name</label><input type="text" id="f-contact" value="${UI.esc(state.contact)}"></div>
            <div class="field${errors.email ? ' has-error' : ''}"><label>Email</label><input type="email" id="f-email" value="${UI.esc(state.email)}">${errors.email ? `<div class="error">${errors.email}</div>` : ''}</div>
          </div>
          <div class="field" style="max-width:260px"><label>Phone</label><input type="text" id="f-phone" value="${UI.esc(state.phone)}"></div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">${editing ? 'Save Changes' : 'Create Supplier'}</button>
            <a class="btn btn-secondary" href="${editing ? '#/suppliers/' + supplier.id : '#/suppliers'}">Cancel</a>
          </div>
        </form>
      </div>`;
    attach();
  }
  function validate(){
    const e = {};
    if (!state.name.trim()) e.name = 'Supplier name is required.';
    if (state.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(state.email.trim())) e.email = 'Enter a valid email address.';
    return e;
  }
  function attach(){
    container.querySelector('#supplier-form').addEventListener('submit', e => {
      e.preventDefault();
      state.name = container.querySelector('#f-name').value;
      state.contact = container.querySelector('#f-contact').value;
      state.email = container.querySelector('#f-email').value;
      state.phone = container.querySelector('#f-phone').value;
      errors = validate();
      if (Object.keys(errors).length){ render(); return; }
      const save = editing ? Store.updateSupplier(id, state) : Store.createSupplier(state);
      save.then(result => {
        UI.toast(editing ? 'Supplier updated.' : 'Supplier created.', 'success');
        UI.navigate('#/suppliers/' + (editing ? id : result.id));
      }).catch(err => { UI.toast(err.message, 'error'); });
    });
  }
  load();
};
/* SECTION:INIT */
window.addEventListener('hashchange', renderApp);

// Phase 2 fetched reference data (categories + a demo "current user") before the very
// first render, since nothing was gated on authentication yet. Phase 3 flips that:
// every endpoint except POST /auth/login now requires a token nothing has yet (see
// docs/phase-3-plan.md), so there is nothing safe to fetch before the user has
// actually signed in — renderApp()'s own auth gate handles showing the login screen,
// and Store.login() is what fetches categories once a token exists. boot() just
// needs to kick off that first render; if the API turns out to be unreachable, the
// login form surfaces that itself the moment someone submits it (Views.login).
function boot(){
  renderApp();
}

if (document.readyState === 'loading') window.addEventListener('DOMContentLoaded', boot);
else boot(); // script ran after DOMContentLoaded already fired
</script>
</body>
</html>
